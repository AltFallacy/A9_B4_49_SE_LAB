{% extends "base.html" %}

{% block title %}Login &mdash; Sports Management System{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="card">
        <div class="auth-header">
            <h1 class="auth-title">Staff Login</h1>
            <p class="auth-subtitle">Sign in to manage sports equipment inventory</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}{% if request.args.get('next') %}?next={{ request.args.get('next') }}{% endif %}" novalidate>
            <!-- CSRF Protection Token -->
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

            <div class="form-group">
                <label for="username" class="form-label">Username <span class="required">*</span></label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    class="form-control" 
                    placeholder="Enter your username"
                    value="{{ username|default('') }}" 
                    required 
                    autofocus
                    autocomplete="username"
                >
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password <span class="required">*</span></label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    class="form-control" 
                    placeholder="Enter your password"
                    required
                    autocomplete="current-password"
                >
            </div>

            <div style="margin-top: 1.5rem;">
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">
                    Sign In
                </button>
            </div>
        </form>

        <div style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--border-color); text-align: center; font-size: 0.825rem; color: var(--text-muted);">
            <p><strong>Demonstration Note:</strong></p>
            <p>Default Admin: <code>admin</code> | Password: <code>admin123</code></p>
            <p style="margin-top: 0.25rem;">Initialized via <code>python3 init_db.py</code></p>
        </div>
    </div>
</div>
{% endblock %}
